<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vozen enterprise AI governance cover</title>
  <desc id="desc">A warm paper editorial cover for Vozen showing a governed AI gateway between apps, models, guardrails, audit, and cost controls.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#e7e5da" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#17160f" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17160f" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2536e4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2536e4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#faf9f5"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.78"/>
  <circle cx="820" cy="120" r="270" fill="url(#accentFade)"/>
  <circle cx="1040" cy="520" r="210" fill="#eceefe" opacity="0.55"/>

  <g transform="translate(72 72)">
    <rect width="56" height="56" rx="12" fill="#17160f"/>
    <rect x="18" y="18" width="20" height="20" rx="5" transform="rotate(45 28 28)" fill="#2536e4"/>
    <text x="76" y="24" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="1.6" fill="#2536e4">ENTERPRISE-GRADE · EDGE-NATIVE</text>
    <text x="76" y="52" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#6a685e">Control layer for every model call</text>
  </g>

  <g transform="translate(72 190)">
    <text font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="72" font-weight="700" line-height="1" fill="#17160f">
      <tspan x="0" y="0">Enterprise AI,</tspan>
      <tspan x="0" y="78">governed by default.</tspan>
    </text>
    <text x="0" y="192" font-family="Inter, system-ui, sans-serif" font-size="25" fill="#6a685e">
      <tspan x="0" dy="0">Access control, guardrails, audit trails,</tspan>
      <tspan x="0" dy="36">and spend limits enforced on every call.</tspan>
    </text>
  </g>

  <g transform="translate(72 480)">
    <rect x="0" y="0" width="164" height="44" rx="6" fill="#17160f"/>
    <text x="25" y="29" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#faf9f5">Book a demo</text>
    <rect x="180" y="0" width="196" height="44" rx="6" fill="none" stroke="#d9d6c8"/>
    <text x="204" y="29" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650" fill="#17160f">Explore platform</text>
    <path d="M344 22h16m-6-7 7 7-7 7" fill="none" stroke="#17160f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(500 452)">
    <text font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="1.2" fill="#9b998e">SOC 2 TYPE II · SSO / SAML · DATA RESIDENCY · 99.99% UPTIME</text>
  </g>

  <g transform="translate(635 96)" filter="url(#shadow)">
    <rect width="464" height="316" rx="14" fill="#131217" stroke="#26242e"/>
    <rect width="464" height="44" rx="14" fill="#17161d"/>
    <path d="M0 44h464" stroke="#26242e"/>
    <circle cx="24" cy="22" r="6" fill="#3a3844"/>
    <circle cx="44" cy="22" r="6" fill="#3a3844"/>
    <circle cx="64" cy="22" r="6" fill="#3a3844"/>
    <text x="90" y="27" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6f6c7d">gateway.policy.ts</text>

    <text x="28" y="88" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#d7d4e2">
      <tspan fill="#b79cff">import</tspan><tspan> { Vozen } </tspan><tspan fill="#b79cff">from</tspan><tspan> </tspan><tspan fill="#7ee0b8">"@vozen/sdk"</tspan>
      <tspan x="28" dy="34" fill="#b79cff">const</tspan><tspan fill="#d7d4e2"> ai = </tspan><tspan fill="#b79cff">new</tspan><tspan fill="#7cc4ff"> Vozen</tspan><tspan>()</tspan>
      <tspan x="28" dy="48" fill="#6f6c7d">// authenticated, policy-checked, audited</tspan>
      <tspan x="28" dy="34" fill="#b79cff">await</tspan><tspan fill="#d7d4e2"> ai.chat({</tspan>
      <tspan x="54" dy="34" fill="#d7d4e2">model: </tspan><tspan fill="#7ee0b8">"any-approved-model"</tspan><tspan>,</tspan>
      <tspan x="54" dy="34" fill="#d7d4e2">budget: </tspan><tspan fill="#7ee0b8">"team-prod"</tspan>
      <tspan x="28" dy="34" fill="#d7d4e2">})</tspan>
    </text>
    <rect x="142" y="286" width="9" height="18" fill="#2536e4"/>
  </g>

  <g transform="translate(702 430)" filter="url(#softShadow)">
    <rect width="328" height="112" rx="8" fill="#ffffff" stroke="#e7e5da"/>
    <text x="26" y="36" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#2536e4">POLICY CHECK</text>
    <text x="26" y="70" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#17160f">Gateway approved</text>
    <text x="26" y="94" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6a685e">RBAC · PII redaction · token budget</text>
    <circle cx="284" cy="55" r="24" fill="#eceefe"/>
    <path d="M273 55l8 8 15-18" fill="none" stroke="#2536e4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(578 292)">
    <path d="M0 24H88" fill="none" stroke="#2536e4" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
    <circle cx="0" cy="24" r="6" fill="#2536e4"/>
    <circle cx="88" cy="24" r="6" fill="#2536e4"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#17160f">
    <g transform="translate(636 34)">
      <rect width="132" height="38" rx="19" fill="#ffffff" stroke="#e7e5da"/>
      <text x="21" y="25">Apps</text>
    </g>
    <g transform="translate(948 36)">
      <rect width="150" height="38" rx="19" fill="#ffffff" stroke="#e7e5da"/>
      <text x="24" y="25">Models</text>
    </g>
    <g transform="translate(1054 430)">
      <rect width="74" height="74" rx="8" fill="#2536e4"/>
      <path d="M1079 466l10 10 19-26" transform="translate(-1054 -430)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
